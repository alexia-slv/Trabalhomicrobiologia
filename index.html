<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trabalho de Microbiologia – Alexia de Freitas</title>
<style>
  :root {
    --bg1: #1a0b2e;
    --bg2: #3b1470;
    --bg3: #0f4a3c;
    --green: #3ddc97;
    --violet: #a77bff;
    --text: #f4eefc;
    --muted: #c9b8e6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(130deg, var(--bg1), var(--bg2), var(--bg3), var(--bg1));
    background-size: 300% 300%;
    animation: flow 22s ease-in-out infinite;
    overflow-x: hidden;
  }
  @keyframes flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* micróbios flutuando (campo do microscópio) */
  #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #bubbles::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(8,2,18,.7) 100%);
  }
  .micro { position: absolute; animation: drift var(--dur) ease-in-out infinite alternate; }
  .micro svg { display: block; overflow: visible; animation: spin var(--spin) linear infinite; }
  @keyframes drift {
    from { transform: translate(0, 0); }
    to   { transform: translate(var(--dx), var(--dy)); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  main {
    position: relative; z-index: 1;
    width: min(100%, 1180px); margin: 0 auto;
    padding: clamp(30px, 6vw, 64px) clamp(16px, 4vw, 32px) 48px;
    display: flex; flex-direction: column; align-items: center; gap: clamp(20px, 3vw, 30px);
    text-align: center;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 4rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .autora { color: var(--muted); font-size: clamp(1rem, 2.4vw, 1.25rem); }
  .autora strong { color: var(--green); font-weight: 600; }

  .lente {
    width: 100%;
    padding: clamp(5px, 1.2vw, 10px);
    border-radius: clamp(16px, 3vw, 28px);
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(61,220,151,.45);
    box-shadow: 0 0 0 6px rgba(167,123,255,.08), 0 24px 70px rgba(0,0,0,.5), 0 0 60px rgba(61,220,151,.15);
    backdrop-filter: blur(6px);
  }
  video, iframe {
    display: block; width: 100%; aspect-ratio: 16 / 9;
    border: 0; border-radius: clamp(11px, 2.2vw, 20px); background: #000;
  }
  footer { color: var(--muted); font-size: .9rem; }

  .galeria { width: 100%; margin-top: clamp(42px, 7vw, 72px); text-align: left; }
  .galeria h2 {
    margin-bottom: 28px;
    color: var(--green);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    text-align: center;
  }
  .grade-fotos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
    gap: clamp(14px, 2.5vw, 26px);
  }
  .foto {
    overflow: hidden;
    padding: 5px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 18px;
    background: rgba(255,255,255,.06);
    box-shadow: 0 12px 30px rgba(0,0,0,.24);
  }
  .foto img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    border-radius: 13px;
    transition: transform .3s ease;
    cursor: zoom-in;
  }
  .foto:hover img { transform: scale(1.025); }
  .foto figcaption { display: none; }
  .visualizador {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(8, 4, 16, .9);
    backdrop-filter: blur(8px);
  }
  .visualizador[hidden] { display: none; }
  .visualizador img {
    display: block;
    max-width: min(96vw, 1600px);
    max-height: 92vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 24px 80px rgba(0,0,0,.55);
  }
  .fechar-visualizador {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 50%;
    color: white;
    background: rgba(255,255,255,.12);
    font-size: 1.7rem;
    cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { .foto img { transition: none; } }
  @media (max-width: 600px) {
    main {
      padding: 30px 14px calc(30px + env(safe-area-inset-bottom));
      gap: 20px;
    }
    h1 { max-width: 12ch; font-size: clamp(2rem, 9vw, 2.7rem); }
    .autora { font-size: 1rem; }
    .lente { padding: 5px; border-radius: 16px; }
    video, iframe { border-radius: 11px; }
    .galeria { margin-top: 30px; }
    .galeria h2 { margin-bottom: 18px; }
    .grade-fotos { grid-template-columns: 1fr; gap: 16px; }
    .foto { padding: 4px; border-radius: 15px; }
    .foto img { aspect-ratio: 4 / 3; border-radius: 11px; }
    .visualizador { padding: 12px; }
    .visualizador img { max-width: 100%; max-height: 84vh; border-radius: 6px; }
    .fechar-visualizador {
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      width: 42px;
      height: 42px;
    }
    footer { padding: 0 12px; }
  }

  a:focus-visible, video:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    .micro, .micro svg { animation: none; }
  }
</style>
</head>
<body>

<main>

  <div class="visualizador" id="visualizador" role="dialog" aria-modal="true" aria-label="Imagem ampliada" hidden>
    <button class="fechar-visualizador" type="button" aria-label="Fechar imagem">&times;</button>
    <img src="" alt="">

<script>
  const visualizador = document.getElementById('visualizador');
  const imagemAmpliada = visualizador.querySelector('img');
  const fecharVisualizador = visualizador.querySelector('button');
  let imagemAnterior = null;

  function abrirImagem(imagem) {
    imagemAnterior = imagem;
    imagemAmpliada.src = imagem.src;
    imagemAmpliada.alt = imagem.alt;
    visualizador.hidden = false;
    document.body.style.overflow = 'hidden';
    fecharVisualizador.focus();
  }

  function fecharImagem() {
    visualizador.hidden = true;
    imagemAmpliada.src = '';
    document.body.style.overflow = '';
    if (imagemAnterior) imagemAnterior.focus();
  }

  document.querySelectorAll('.foto img').forEach(imagem => {
    imagem.addEventListener('click', () => abrirImagem(imagem));
    imagem.addEventListener('keydown', evento => {
      if (evento.key === 'Enter' || evento.key === ' ') {
        evento.preventDefault();
        abrirImagem(imagem);
      }
    });
  });
  fecharVisualizador.addEventListener('click', fecharImagem);
  visualizador.addEventListener('click', evento => {
    if (evento.target === visualizador) fecharImagem();
  });
  document.addEventListener('keydown', evento => {
    if (evento.key === 'Escape' && !visualizador.hidden) fecharImagem();
  });

  const box = document.getElementById('bubbles');
  const NS = 'http://www.w3.org/2000/svg';
  const rnd = (a, b) => a + Math.random() * (b - a);
  const cores = ['#3ddc97', '#b8f36b', '#a77bff', '#d9b8ff'];

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  // cada função desenha um micróbio e devolve [largura, altura]
  const tipos = [
    function cadeia(svg, c) { // cocos em cadeia (tipo estreptococo)
      const n = Math.round(rnd(4, 8));
      for (let i = 0; i < n; i++) {
        const cx = 14 + i * 21, cy = 22 + Math.sin(i * 0.9) * 7;
        el('circle', { cx, cy, r: 10, fill: c, 'fill-opacity': .28, stroke: c, 'stroke-width': 2 }, svg);
        el('circle', { cx: cx - 3, cy: cy - 3, r: 2.5, fill: '#fff', 'fill-opacity': .5 }, svg);
      }
      return [n * 21 + 8, 44];
    },
    function bacilo(svg, c) { // bastonete
      el('rect', { x: 2, y: 3, width: 72, height: 22, rx: 11, fill: c, 'fill-opacity': .28, stroke: c, 'stroke-width': 2 }, svg);
      [20, 38, 56].forEach(x => el('circle', { cx: x, cy: 14, r: 2.5, fill: c, 'fill-opacity': .7 }, svg));
      return [76, 28];
    },
    function espirilo(svg, c) { // espiral
      let d = 'M2 20';
      for (let x = 2; x <= 122; x += 4) d += ' L' + x + ' ' + (20 + Math.sin(x / 9) * 11).toFixed(1);
      el('path', { d, fill: 'none', stroke: c, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-opacity': .55 }, svg);
      return [124, 40];
    },
    function flagelado(svg, c) { // célula com flagelo
      el('circle', { cx: 22, cy: 22, r: 17, fill: c, 'fill-opacity': .22, stroke: c, 'stroke-width': 2 }, svg);
      el('circle', { cx: 18, cy: 20, r: 6, fill: c, 'fill-opacity': .5 }, svg);
      let d = 'M39 22';
      for (let x = 39; x <= 100; x += 3) d += ' L' + x + ' ' + (22 + Math.sin((x - 39) / 6) * 5).toFixed(1);
      el('path', { d, fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-linecap': 'round' }, svg);
      return [102, 44];
    }
  ];

  for (let i = 0; i < 18; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'micro';
    const svg = document.createElementNS(NS, 'svg');
    const c = cores[Math.floor(Math.random() * cores.length)];
    const [w, h] = tipos[Math.floor(Math.random() * tipos.length)](svg, c);
    const k = rnd(0.8, 2.2);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('width', w * k);
    svg.setAttribute('height', h * k);
    wrap.style.left = rnd(-3, 95) + '%';
    wrap.style.top = rnd(-3, 95) + '%';
    wrap.style.setProperty('--dx', rnd(-14, 14) + 'vw');
    wrap.style.setProperty('--dy', rnd(-14, 14) + 'vh');
    wrap.style.setProperty('--dur', rnd(18, 40) + 's');
    wrap.style.setProperty('--spin', rnd(70, 140) + 's');
    wrap.style.animationDelay = (-rnd(0, 30)) + 's';
    wrap.style.opacity = rnd(0.35, 0.8);
    wrap.style.filter = 'blur(' + (k > 1.7 ? rnd(1.5, 3) : rnd(0, 0.8)).toFixed(1) + 'px)';
    wrap.appendChild(svg);
    box.appendChild(wrap);
  }
</script>
</body>
